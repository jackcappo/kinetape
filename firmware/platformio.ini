; KineTape firmware - ESP32 DevKit (esp32dev), Arduino framework.
; Build:   py -m platformio run -d firmware
; Flash:   py -m platformio run -d firmware -t upload
; Monitor: py -m platformio device monitor -d firmware
; Tests:   py -m platformio test -d firmware -e esp32dev   (runs on the board)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
; default.csv: 1.25 MB app, ~1.4 MB "spiffs" data partition (used by LittleFS)
board_build.partitions = default.csv
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
; Unit tests (test/test_protocol) only need the header-only protocol.h
test_build_src = no

; Host-side run of the same protocol test (needs a host gcc on PATH, e.g.
; PlatformIO's MinGW package: pio pkg install -g -t platformio/toolchain-gccmingw32
; then add ~/.platformio/packages/toolchain-gccmingw32/bin to PATH).
;   py -m platformio test -d firmware -e native
[env:native]
platform = native
build_flags = -std=gnu++11 -Wall
test_build_src = no
